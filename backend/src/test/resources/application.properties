# Settings used only by the tests. Because this file has the same name as
# src/main/resources/application.properties and comes first on the test
# classpath, the tests use it INSTEAD of the real settings. That keeps them
# independent of PostgreSQL, of DB_PASSWORD and of any local .env file.

spring.application.name=MeetMind Backend (tests)

# a database that lives only in memory, in PostgreSQL-compatible mode
spring.datasource.url=jdbc:h2:mem:meetmind-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# nothing listens here; tests that need an AI service start their own stub
ai.service.url=http://127.0.0.1:1

# uploaded test recordings go here (inside target/), never into the real uploads/ folder
meetmind.upload-dir=target/test-uploads
