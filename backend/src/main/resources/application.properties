spring.application.name=MeetMind Backend

# Optional file backend/.env with lines such as DB_PASSWORD=your-password.
# It is ignored by git, so the password never ends up in the repository.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meetmind_db}
spring.datasource.username=${DB_USERNAME:meetmind_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
# Accounts: the login token is signed with JWT_SECRET (at least 32 characters).
# If it is not set, a random one is made at startup and everybody has to log
# in again after every restart.
meetmind.jwt.secret=${JWT_SECRET:}
meetmind.jwt.hours=${JWT_HOURS:12}

# Too many wrong passwords or recovery codes lock an email for a while.
meetmind.security.max-failures=${MAX_LOGIN_FAILURES:5}
meetmind.security.window-minutes=${LOGIN_LOCK_MINUTES:15}
